<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar — pre-token protocols ranked by fitted value</title>
<link rel="stylesheet" href="app.css">
<script src="../data.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>TOKEN LAUNCH RADAR</h1>
  <p class="sub">Which pre-token protocol is worth farming next — ranked by a fitted
  implied value, with a costed plan for each one. Snapshot <span id="asof"></span>.</p>
</header>
<section id="strip" aria-label="Integrity strip"></section>
<section id="farmpicks" aria-label="Top FARM picks"></section>
<section id="controls">
  <input id="q" type="search" placeholder="Filter by name or slug…" aria-label="Filter by name or slug">
  <span id="verdict-filters" role="group" aria-label="Filter by verdict"></span>
  <span id="rowcount"></span>
</section>
<main>
  <table id="board">
    <thead><tr>
      <th data-k="rank">#</th><th data-k="name">Protocol</th><th data-k="tvl_usd">TVL</th>
      <th data-k="age_days">Age</th><th data-k="odds">Odds</th><th data-k="implied_value_usd">Implied value</th>
      <th data-k="ev_usd">Farmer EV</th><th data-k="cost_usd">Cost</th><th data-k="verdict">Verdict</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<dialog id="detail"></dialog>
<footer>
  <p id="method"></p>
  <p id="accounting"></p>
</footer>
</body>
</html>
